name: agent-platform

x-python-service: &python-service
  image: ${COMPOSE_PROJECT_NAME:-agent-platform}-python:kafka-v1
  volumes:
    - worker_runtime:/data/worker
  init: true
  stop_grace_period: 30s
  restart: unless-stopped
  networks: [backend, model_egress]

x-python-environment: &python-environment
  WORKBENCH_CONTAINER: "1"
  WORKBENCH_STORAGE_MODE: java
  WORKBENCH_QUEUE_MODE: kafka
  STORAGE_SERVICE_URL: http://storage:8780
  STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Generate a local storage service token in .env first}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-agent.jobs.v1}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  HOME: /data/worker/home
  LANGSMITH_TRACING: "false"
  RELEASE_API_KEY: ${MODEL_API_KEY:-}
  RELEASE_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  RELEASE_MODEL: ${MODEL_NAME:-qwen3.8-flash}
  DEEPSEEK_API_KEY: ${MODEL_API_KEY:-}
  DEEPSEEK_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DEEPSEEK_MODEL: ${MODEL_NAME:-qwen3.8-flash}
  API_PROVIDER: ${MODEL_PROVIDER:-qwen}

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [backend]

  kafka:
    image: &kafka-image registry-1.docker.io/apache/kafka:4.1.2
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    networks: [backend]

  kafka-init:
    image: *kafka-image
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-agent.jobs.v1}
      KAFKA_HEAP_OPTS: -Xms64m -Xmx256m
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic "$${KAFKA_TOPIC}" --partitions 4 --replication-factor 1
        description=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$${KAFKA_TOPIC}")
        if ! printf '%s\n' "$$description" | grep -Eq 'PartitionCount:[[:space:]]*4[[:space:]]'; then
          printf '%s\n' 'The Kafka job topic must have exactly 4 partitions.' >&2
          exit 1
        fi
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  storage:
    build:
      context: ..
      dockerfile: agent_platform/Dockerfile.java
    environment:
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Generate a local storage service token in .env first}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8780"
      SQLITE_PATH: /data/agent-platform.sqlite3
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - storage_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/healthcheck", "HealthProbe", "http://127.0.0.1:8780/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  workbench:
    <<: *python-service
    pull_policy: never
    environment:
      <<: *python-environment
      WORKBENCH_ROLE: web
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      storage:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/platform/healthcheck.py"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 20s

  worker:
    <<: *python-service
    deploy:
      replicas: 2
    build:
      context: ..
      dockerfile: agent_platform/Dockerfile.python
    environment:
      <<: *python-environment
      WORKBENCH_ROLE: worker
      KAFKA_WORKER_READY_FILE: /tmp/agent-kafka-worker.ready
    depends_on:
      storage:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/platform/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  storage_data:
  redis_data:
  worker_runtime:
  kafka_data:

networks:
  backend:
    internal: true
  model_egress:
